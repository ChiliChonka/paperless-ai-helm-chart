apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "paperless-ai.fullname" . }}-test-connection"
  labels:
    {{- include "paperless-ai.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: docker.io/library/busybox:1.37
      command: ['wget', '-q', '-O-']
      args: ['http://{{ include "paperless-ai.fullname" . }}:{{ .Values.service.port }}/health']
  restartPolicy: Never
