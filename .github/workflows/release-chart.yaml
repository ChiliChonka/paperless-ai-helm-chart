name: Release Helm Chart

# Tag chart-<version> (must match paperless-ai/Chart.yaml): checks, pushes the chart to
# oci://ghcr.io/<owner>/charts and creates the GitHub release with the text from CHANGELOG.md.
on:
  push:
    tags:
      - "chart-*"

permissions:
  contents: write   # GitHub release
  packages: write   # GHCR

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # previous tag for the compare link

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Version from the tag
        id: tag
        run: |
          version="${GITHUB_REF_NAME#chart-}"
          chart_version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' paperless-ai/Chart.yaml)
          test "$version" = "$chart_version" || { echo "::error::tag ${version} does not match Chart.yaml ${chart_version}"; exit 1; }
          previous=$(git describe --tags --abbrev=0 --match 'chart-*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      - name: Lint, render and test
        run: |
          python3 -m pip install --user pyyaml
          ./scripts/check.sh

      # Before pushing anything: fails when CHANGELOG.md has no section for this version.
      - name: Release notes
        run: ./scripts/release-notes.sh "${{ steps.tag.outputs.version }}" "${{ steps.tag.outputs.previous }}" > release-notes.md

      - name: Package chart
        run: helm package paperless-ai

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm push paperless-ai-*.tgz "oci://ghcr.io/${OWNER_LC}/charts"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" paperless-ai-*.tgz \
            --title "Release v${{ steps.tag.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag
