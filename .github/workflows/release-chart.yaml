name: Release Helm Chart

on:
  push:
    tags:
      - "chart-*"
  pull_request:
    paths:
      - "paperless-ai/**"
      - ".github/workflows/release-chart.yaml"

permissions:
  contents: read
  packages: write

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint paperless-ai/

      - name: Template validation (dry-run)
        run: helm template paperless-ai paperless-ai/ --debug > /dev/null

      - name: Validate chart packaging
        run: helm package paperless-ai/

  package-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: startsWith(github.ref, 'refs/tags/chart-')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: helm package paperless-ai

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm push paperless-ai-*.tgz "oci://ghcr.io/${OWNER_LC}/charts"
