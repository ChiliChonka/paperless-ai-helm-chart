name: Check Helm Chart

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Lint, render and test
        run: ./scripts/check.sh
